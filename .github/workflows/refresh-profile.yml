name: Refresh profile content

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh recent public projects
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: repos } = await github.rest.repos.listForUser({
              username: context.repo.owner,
              type: 'owner',
              sort: 'updated',
              direction: 'desc',
              per_page: 100,
            });

            const selected = repos
              .filter(repo => !repo.fork && !repo.archived && repo.name !== context.repo.repo)
              .slice(0, 4);

            const items = selected.map(repo => {
              const language = repo.language ? ` · \`${repo.language}\`` : '';
              const description = repo.description ? ` — ${repo.description}` : '';
              return `- [**${repo.name}**](${repo.html_url})${language}${description}`;
            }).join('\n');

            const path = 'README.md';
            const readme = fs.readFileSync(path, 'utf8');
            const next = readme.replace(
              /<!-- START:RECENT-PROJECTS -->[\s\S]*?<!-- END:RECENT-PROJECTS -->/,
              `<!-- START:RECENT-PROJECTS -->\n${items}\n<!-- END:RECENT-PROJECTS -->`,
            );
            fs.writeFileSync(path, next);

      - name: Commit refreshed content
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh recent public work"
          git push
